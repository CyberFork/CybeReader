worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  types { application/javascript mjs; }
  default_type application/octet-stream;
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  server_tokens off;
  server {
    listen 8080;
    absolute_redirect off;
    port_in_redirect off;
    root /usr/share/nginx/html;
    include /etc/nginx/cybereader-security.conf;
    location = /healthz { access_log off; default_type text/plain; return 200 'ok\n'; }
    location = /cybereader { return 308 /cybereader/$is_args$args; }
    location = /cybereader/index.html { include /etc/nginx/cybereader-security.conf; add_header Cache-Control "no-store"; }
    location /cybereader/assets/ { include /etc/nginx/cybereader-security.conf; try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location /cybereader/ { try_files $uri $uri/ /cybereader/index.html; }
    location / { return 404; }
  }
}
