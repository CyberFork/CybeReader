<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CybeReader 草图 · 速读优先，按需展开原文</title><style>*{box-sizing:border-box}body{margin:0;background:#061015;color:#d9eef5;font:15px/1.7 system-ui,sans-serif}header{border-bottom:1px solid #5ef6ff;padding:16px 24px;display:flex;gap:20px;align-items:center}strong,h2{color:#5ef6ff}small{color:#9db2bc}main{max-width:1100px;margin:24px auto;padding:0 20px}.workspace{display:grid;grid-template-columns:180px 1fr;gap:16px}.panel{border:1px solid #285261;padding:20px;background:#0b1b24}button{border:1px solid #397888;background:#12323e;color:#d9eef5;padding:9px 15px;cursor:pointer}button:hover,button:focus-visible{outline:2px solid #5ef6ff}mark{background:#214f5b;color:inherit}.tools{display:flex;gap:10px;flex-wrap:wrap}.focus{font-size:27px;padding:24px;text-align:center}.status{font-size:12px;color:#9db2bc}.note{color:#fead9f;font-size:12px}@media(max-width:650px){.workspace{grid-template-columns:1fr}header{flex-wrap:wrap}.panel{padding:14px}}</style><header><strong>CybeReader / 2077</strong><small>速读优先，按需展开原文</small><span class="note">交互草图 · 不连接真实文档或书库</span></header><main><p>先呈现速读，再主动展开原文；更安静，但多一步。</p><div class="workspace"><aside class="panel"><h2>文档</h2><button id="open">用示例开始</button><p>原文定位 → 专注播放 → 回看 / 书签</p><small>原创示例，无外部请求。</small></aside><section class="panel"><h2>找到位置，开始阅读。</h2><div class="tools"><button id="paper-toggle">展开原文</button><button id="play">从此处播放</button><button id="back">回看原文</button><button id="bookmark">添加书签</button></div><article id="paper" hidden><p>阅读不是与时间赛跑，而是<mark>找到自己的节奏</mark>。选择一段原文，停下来想一想，再继续。</p><p>原文保留上下文，速读窗口只承担当前片段。</p></article><div class="focus">找到自己的节奏</div><p id="status" class="status" role="status">尚未打开示例</p><p id="bookmark-list" class="status">暂无书签</p></section></div></main><script>const paper=document.querySelector('#paper'),status=document.querySelector('#status'),toggle=document.querySelector('#paper-toggle');let ready=false;function label(){toggle.textContent=(paper.hidden?'展开':'收起')+'原文'}document.querySelector('#open').onclick=()=>{ready=true;status.textContent='示例已打开 · 已暂停';paper.hidden=true;label()};toggle.onclick=()=>{paper.hidden=!paper.hidden;label()};document.querySelector('#play').onclick=()=>{status.textContent=ready?'正在播放 · 草图状态切换，不是真实播放器':'请先打开示例'};document.querySelector('#back').onclick=()=>{paper.hidden=false;label();status.textContent='已暂停 · 回到原文'};document.querySelector('#bookmark').onclick=()=>{document.querySelector('#bookmark-list').textContent=ready?'书签：找到自己的节奏':'请先打开示例'};</script></html>
