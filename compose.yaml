name: cybereader
services:
  web:
    image: cybereader:local
    container_name: cybereader
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8083:8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks:
      - work-edge
networks:
  work-edge:
    external: true
    name: work-sync_default
