name: Verify CybeReader
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: |
          docker build -f deploy/Dockerfile -t cybereader:test .
          docker run -d --name cybereader-ci -p 127.0.0.1:4175:8080 cybereader:test
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:4175/cybereader/ >/dev/null && break || sleep 1; done
          npm run test:browser
          APP_URL=http://127.0.0.1:4175/cybereader/ node tests/selection-library-browser.mjs
          APP_URL=http://127.0.0.1:4175/cybereader/ npm run test:journey
